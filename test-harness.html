<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>test harness</title></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const progress = Number(q.get('progress') || 86);
  const fruit = q.get('fruit') || 'strawberry';
  const pot = q.get('pot') || 'cream';
  const inv = {};
  for (const id of ['strawberry', 'apple', 'guava', 'lemon', 'blueberry']) inv[id] = 0;
  for (const part of (q.get('inv') || 'strawberry:2,apple:1,lemon:1').split(',')) {
    const [id, n] = part.split(':');
    if (id in inv) inv[id] = Number(n) || 0;
  }
  const state = {
    version: 1,
    gardenName: q.get('name') || '小满园',
    plant: progress < 0 ? null : {
      fruitId: fruit,
      potId: pot,
      progress,
      pos: { x: 50, y: 18 },
      plantedAt: Date.now() - 86400000 * 3
    },
    cooldowns: { waterUntil: 0, soilUntil: 0 },
    focus: null,
    inventory: inv,
    stats: { harvested: 2, cooked: 1 },
    lastDish: null
  };
  localStorage.setItem('desktop-garden.v1', JSON.stringify(state));
  location.replace('index.html');
</script>
</body>
</html>
