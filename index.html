<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的小园</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="widget" id="widget" data-chrome="hidden">
    <header class="bar" id="bar">
      <h1 class="garden-name" id="gardenTitle">我的小园</h1>
      <div class="bar-right">
        <button class="icon-btn" id="renameBtn" aria-label="改名">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
        <button class="icon-btn basket" id="basketBtn" aria-label="小仓库">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.4 9.2A2 2 0 0 1 16.6 20H7.4a2 2 0 0 1-2-1.8L4 9Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="basketBadge">0</span>
        </button>
      </div>
    </header>

    <section class="scene" id="scene">
      <div class="plant-stage" id="plantStage" hidden tabindex="0" role="button" aria-label="照顾这株植物">
        <div class="plant-sway" id="plantSway">
          <img class="plant-img" id="plantImg" alt="" draggable="false" />
        </div>
        <img class="pot-img" id="potImg" alt="" draggable="false" />
      </div>

      <button class="seed-cta" id="emptyPlantBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V7"/><path d="M12 12c-4 0-6-2-6-5 4 0 6 2 6 5Z"/><path d="M12 10c0-3 2-5 6-5 0 3-2 5-6 5Z"/></svg>
        种一株
      </button>

      <p class="stage-name" id="stageTag"></p>
      <p class="hint-ripe" id="harvestHint">快结果了，加油坚持</p>
      <div class="focus-chip" id="focusPill" hidden><i></i><span id="focusPillText"></span></div>
      <div class="fx" id="fxLayer"></div>
      <p class="toast" id="toast"></p>
    </section>

    <div class="rename" id="renameBar" hidden>
      <input id="renameInput" maxlength="12" placeholder="我的小园" aria-label="小园名字" />
      <button id="renameSave">好</button>
      <button id="renameSkip" class="ghost">先跳过</button>
    </div>

    <section class="sheet care" id="careSheet" hidden>
      <button class="sheet-x" id="careClose" aria-label="收起">×</button>
      <p class="care-stage" id="careStage"></p>
      <div class="acts">
        <button class="act" id="actWater">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4 5 6 8.2 6 11a6 6 0 0 1-12 0c0-2.8 2-6 6-11Z"/></svg>
          <b>喝水</b>
          <i id="waterNote"></i>
        </button>
        <button class="act" id="actFocus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
          <b>专注</b>
          <i id="focusNote"></i>
        </button>
        <button class="act" id="actSoil">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-9 9-5 1 1-5 7-11Z"/><path d="M12 6l6 6"/></svg>
          <b>动一动</b>
          <i id="soilNote"></i>
        </button>
      </div>
      <div class="care-foot">
        <button class="link-btn" id="sharePlantBtn">分享这一刻</button>
        <button class="primary-btn" id="harvestBtn" hidden>收获</button>
      </div>
    </section>

    <section class="sheet plant-sheet" id="plantSheet" hidden>
      <p class="sheet-kicker" id="plantStep">选一株</p>
      <div class="seed-list" id="seedList"></div>
      <div class="pot-list" id="potList" hidden></div>
      <div class="sheet-foot">
        <button class="link-btn" id="plantBack" hidden>上一步</button>
        <button class="primary-btn" id="plantConfirm">下一步</button>
      </div>
    </section>

    <section class="sheet basket-sheet" id="basketSheet" hidden>
      <button class="sheet-x" id="basketClose" aria-label="收起">×</button>
      <p class="sheet-kicker">小仓库</p>
      <div class="inv-list" id="invList"></div>
      <div class="chips" id="pickedChips"></div>
      <button class="primary-btn wide" id="cookBtn">开始烹饪</button>
    </section>

    <section class="dish-layer" id="dishLayer" hidden>
      <div class="dish-card" id="dishCard">
        <div class="dish-art" id="dishArt"></div>
        <p class="dish-type" id="dishType"></p>
        <h2 class="dish-name" id="dishName"></h2>
        <p class="dish-desc" id="dishDesc"></p>
        <div class="dish-actions">
          <button class="link-btn" id="dishShare">分享图</button>
          <button class="primary-btn" id="dishAccept">收下</button>
        </div>
      </div>
    </section>

    <div class="cook-layer" id="cookLayer" hidden>
      <div class="cook-box">
        <div class="cook-art" id="cookArt"></div>
        <p class="cook-text" id="cookText">把果子洗干净…</p>
        <div class="cook-bar"><i id="cookBarFill"></i></div>
      </div>
    </div>

    <section class="share-layer" id="shareLayer" hidden>
      <button class="sheet-x share-x" id="shareClose" aria-label="关闭">×</button>
      <div class="share-preview" id="sharePreview"></div>
      <div class="share-actions">
        <button class="link-btn" id="shareSave">保存</button>
        <button class="primary-btn" id="shareSend">分享</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
